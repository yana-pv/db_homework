version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: autoservice-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: autoservice
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - autoservice_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d autoservice"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    container_name: autoservice-flyway
    command: -url=jdbc:postgresql://postgres:5432/autoservice -user=admin -password=admin migrate
    volumes:
      - ./migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - autoservice_net

  # ================= REPLICA 1 (PHYSICAL) =================
  pg-replica1:
    image: postgres:15
    container_name: pg-replica1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: autoservice
    ports:
      - "5433:5432"
    volumes:
      - replica1_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c hot_standby=on
      -c listen_addresses=*
    networks:
      - autoservice_net
    depends_on:
      - postgres

  # ================= REPLICA 2 (LOGICAL) =================
  pg-replica2:
    image: postgres:15
    container_name: pg-replica2
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: autoservice
    ports:
      - "5434:5432"
    volumes:
      - replica2_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c wal_level=logical 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c listen_addresses=*
    networks:
      - autoservice_net
    depends_on:
      - postgres

volumes:
  postgres_data: 
  replica1_data:  
  replica2_data:  

networks:
  autoservice_net:
    driver: bridge